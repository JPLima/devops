name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a superseded run on the same ref rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.9.8"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

  validate:
    name: Validate ${{ matrix.directory }}
    runs-on: ubuntu-latest

    strategy:
      # One broken root module should not hide the state of the others.
      fail-fast: false

      matrix:
        directory:
          # Root configurations. These fetch modules from the git tag, so
          # init needs network access and the repository must be readable.
          - task1-terraform-module
          - task1-terraform-module/bootstrap
          - task2-aws-security
          - task3-lambda-troubleshooting/terraform
          # Every module, validated on its own so a break is attributed to the
          # module rather than to whichever root happened to use it.
          - modules/security-group
          - modules/kms-key
          - modules/vpc
          - modules/ec2
          - modules/rds
          - modules/iam-instance-role
          - modules/cloudtrail
          - modules/aws-config
          - modules/security-alerting
          - modules/secret

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # -backend=false: no AWS credentials, and no state bucket to reach.
      - name: terraform init
        run: terraform -chdir=${{ matrix.directory }} init -backend=false -input=false

      # TF_WORKSPACE because task 1 indexes its per-environment settings by
      # workspace name and has no entry for "default", by design. The variable
      # works without an initialised backend.
      - name: terraform validate
        run: terraform -chdir=${{ matrix.directory }} validate
        env:
          TF_WORKSPACE: staging

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: tflint
        run: tflint --recursive --minimum-failure-severity=warning
        env:
          TF_WORKSPACE: staging

  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          # .checkov.yaml carries the directory, framework and the one excluded
          # path. Individual exceptions are inline `#checkov:skip` comments
          # next to the code they apply to, each with a reason; a central
          # suppression list is where exceptions go to be forgotten.
          config_file: .checkov.yaml
          soft_fail: false
          output_format: cli

  test:
    name: Lambda tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r task3-lambda-troubleshooting/tests/requirements.txt

      # Against moto, in process. No AWS account and no credentials.
      - name: pytest
        run: pytest task3-lambda-troubleshooting/tests -v
        working-directory: .
